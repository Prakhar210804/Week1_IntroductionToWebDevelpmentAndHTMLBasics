<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise_3</title>
    <style>
        body{
            background-color: gray;
        }
        .wrapper{
            background-color: white;
            height: 480px;
            width: 244px;
            border-radius: 10px;
        }
        img{
            height:40%;
            width: 96%;
            margin-left: 5px;
            margin-top: 5px;
            border-radius: 10px;
        }
        span{
            color: rgb(180, 168, 154);
            margin-left: 10px;
            padding-left: 10px;
            padding-right: 10px;
            border: 1px solid rgb(237, 229, 229);
            border-radius: 10px;
        }
        h1{
            margin: 10px;
            opacity: 0.7;
        }
        p{
            margin: 10px;
            color: grey;
            font-weight: 600;
        }
       #but{
           display: flex;
           justify-content: center;
           
        }
        button{
            background-color: rgb(146, 207, 209);
            color: rgb(7, 7, 250);
            font-weight: 600;
            border-radius: 20px;
            opacity: 0.5;
            padding-left: 20px;
            padding-top: 10px;
            padding-bottom: 10px;
            padding-right: 20px;
            border: none;
        }
       
    </style>
</head>
<body>
    <div class="wrapper">
           <img src="Image 1 - Copy.jpg" alt="image">
           <br>
           <br>
           <span>Nature</span>
           <span>Lake</span>
           <br><br>
           <h1>Lago di Braies</h1>
           <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Quis fuga assumenda hic ducimus, saepe perspiciatis quo culpa reprehenderit sint.
          </p>
          <br><div id="but"><button>Read More</button> </div>
         
    </div>
</body>
</html>
